version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hiralal_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hiralal_rewards
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/prisma/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hiralal_rewards']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiralal_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/hiralal_rewards?schema=public
      JWT_SECRET: hiralal_super_secret_jwt_key_2026_rewards_secure
      DEFAULT_REWARD_PERCENTAGE: 0.5
      MONTHLY_REWARD_POOL_CAP: 50000
      MIN_REDEMPTION_AMOUNT: 500
    ports:
      - '5000:5000'

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: hiralal_admin
    restart: always
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - '3000:3000'

volumes:
  pgdata:
    driver: local
