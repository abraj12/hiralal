version: '3.8'

# ==============================================================================
# Hiralal & Sons Sales Pvt. Ltd. - Production Multi-Container Compose
# Platform: Hostinger KVM 2 VPS (2 vCPU, 8 GiB RAM, 100 GB NVMe, Ubuntu x86_64)
# Memory Budget:
#   PostgreSQL 16:  1280 MB limit
#   Redis 7:         256 MB limit
#   Backend API:     768 MB limit
#   Worker Daemon:   512 MB limit
#   Admin Frontend:  512 MB limit
#   Nginx Proxy:     128 MB limit
#   System / Kernel: ~4600 MB Headroom
#   Total Stack:    < 8192 MB Physical RAM
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: hiralal_postgres
    restart: unless-stopped
    command: postgres -c shared_buffers=512MB -c work_mem=16MB -c maintenance_work_mem=128MB -c effective_cache_size=1GB -c max_connections=100
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1280M
        reservations:
          cpus: '0.2'
          memory: 512M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hiralal_rewards}
    expose:
      - '5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - hiralal_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-hiralal_rewards}']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  redis:
    image: redis:7-alpine
    container_name: hiralal_redis
    restart: unless-stopped
    user: "999:999"
    command: >-
      sh -c 'printf "requirepass %s\n" "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf --appendonly yes --maxmemory 200mb --maxmemory-policy noeviction'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    expose:
      - '6379'
    volumes:
      - redisdata:/data
    networks:
      - hiralal_net
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  backend:
    image: hiralal-backend:${HIRALAL_IMAGE_TAG:?HIRALAL_IMAGE_TAG is required}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VCS_REF: ${HIRALAL_IMAGE_TAG:-unknown}
    container_name: hiralal_backend
    restart: unless-stopped
    command: node dist/server.js
    deploy:
      resources:
        limits:
          cpus: '1.2'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVICE_ROLE: api
      PORT: 5000
      NODE_ENV: production
      NODE_OPTIONS: '--max-old-space-size=512'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hiralal_rewards}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ADMIN_ACCESS_SECRET: ${JWT_ADMIN_ACCESS_SECRET:?JWT_ADMIN_ACCESS_SECRET is required}
      BILL_ADMIN_PREFIX: ${BILL_ADMIN_PREFIX:?BILL_ADMIN_PREFIX is required}
      OPERATIONS_ADMIN_PREFIX: ${OPERATIONS_ADMIN_PREFIX:?OPERATIONS_ADMIN_PREFIX is required}
      BILL_ADMIN_MOBILE: ${BILL_ADMIN_MOBILE:-}
      OPERATIONS_ADMIN_MOBILE: ${OPERATIONS_ADMIN_MOBILE:-}
      BILL_ADMIN_INITIAL_PASSWORD: ${BILL_ADMIN_INITIAL_PASSWORD:-}
      OPERATIONS_ADMIN_INITIAL_PASSWORD: ${OPERATIONS_ADMIN_INITIAL_PASSWORD:-}
      SIGNCARE_BASE_URL: ${SIGNCARE_BASE_URL:-https://api.signcare.in}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required}
      BLIND_INDEX_SECRET: ${BLIND_INDEX_SECRET:?BLIND_INDEX_SECRET is required}
      # F-05: Dedicated OTP HMAC secret — must differ from JWT and encryption keys
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET is required}
      STORAGE_HMAC_SECRET: ${STORAGE_HMAC_SECRET:?STORAGE_HMAC_SECRET is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?R2_BUCKET_NAME is required}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      SIGNCARE_API_KEY: ${SIGNCARE_API_KEY:?SIGNCARE_API_KEY is required}
      SIGNCARE_APP_ID: ${SIGNCARE_APP_ID:?SIGNCARE_APP_ID is required}
      RAZORPAYX_KEY_ID: ${RAZORPAYX_KEY_ID:?RAZORPAYX_KEY_ID is required}
      RAZORPAYX_KEY_SECRET: ${RAZORPAYX_KEY_SECRET:?RAZORPAYX_KEY_SECRET is required}
      RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER:?RAZORPAYX_ACCOUNT_NUMBER is required}
      RAZORPAYX_WEBHOOK_SECRET: ${RAZORPAYX_WEBHOOK_SECRET:?RAZORPAYX_WEBHOOK_SECRET is required}
      OTP_PROVIDER: ${OTP_PROVIDER:-WHATSAPP}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-hiralal_auth_otp}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en_US}
      WHATSAPP_AUTH_BUTTON_TYPE: ${WHATSAPP_AUTH_BUTTON_TYPE:-COPY_CODE}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-HIRLAL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      PLAY_INTEGRITY_CLIENT_EMAIL: ${PLAY_INTEGRITY_CLIENT_EMAIL:-}
      PLAY_INTEGRITY_PRIVATE_KEY: ${PLAY_INTEGRITY_PRIVATE_KEY:-}
      PLAY_INTEGRITY_PACKAGE_NAME: ${PLAY_INTEGRITY_PACKAGE_NAME:-com.hiralal.rewards}
      PLAY_INTEGRITY_ALLOWED_CERT_DIGESTS: ${PLAY_INTEGRITY_ALLOWED_CERT_DIGESTS:-}
      PLAY_INTEGRITY_ALLOW_MOCK: ${PLAY_INTEGRITY_ALLOW_MOCK:-false}
      PLAY_INTEGRITY_REQUIRE_LICENSING: ${PLAY_INTEGRITY_REQUIRE_LICENSING:-true}
      PLAY_INTEGRITY_ENFORCE_ACTIONS: ${PLAY_INTEGRITY_ENFORCE_ACTIONS:-true}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY:-}
    expose:
      - '5000'
    volumes:
      - uploads:/app/uploads
      - ./shared/assets:/shared/assets:ro
      - ./scripts:/app/scripts:ro
    networks:
      - hiralal_net
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:5000/health/ready").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  migrate:
    profiles:
      - tools
    image: hiralal-migrate:${HIRALAL_IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
      args:
        VCS_REF: ${HIRALAL_IMAGE_TAG:-unknown}
    container_name: hiralal_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hiralal_rewards}?schema=public
    networks:
      - hiralal_net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  worker:
    image: hiralal-worker:${HIRALAL_IMAGE_TAG:?HIRALAL_IMAGE_TAG is required}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VCS_REF: ${HIRALAL_IMAGE_TAG:-unknown}
    container_name: hiralal_worker
    restart: unless-stopped
    command: node dist/worker/index.js
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      SERVICE_ROLE: worker
      NODE_ENV: production
      NODE_OPTIONS: '--max-old-space-size=384'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hiralal_rewards}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required}
      BLIND_INDEX_SECRET: ${BLIND_INDEX_SECRET:?BLIND_INDEX_SECRET is required}
      # F-05: Dedicated OTP HMAC secret — must differ from JWT and encryption keys
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET is required}
      STORAGE_HMAC_SECRET: ${STORAGE_HMAC_SECRET:?STORAGE_HMAC_SECRET is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?R2_BUCKET_NAME is required}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      RAZORPAYX_KEY_ID: ${RAZORPAYX_KEY_ID:?RAZORPAYX_KEY_ID is required}
      RAZORPAYX_KEY_SECRET: ${RAZORPAYX_KEY_SECRET:?RAZORPAYX_KEY_SECRET is required}
      RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER:?RAZORPAYX_ACCOUNT_NUMBER is required}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY:-}
    networks:
      - hiralal_net
    healthcheck:
      test: ['CMD', 'node', '-e', 'const r = require("ioredis"); const c = new r({ host: process.env.REDIS_HOST, port: Number(process.env.REDIS_PORT), password: process.env.REDIS_PASSWORD, connectTimeout: 3000 }); c.ping().then(() => { c.disconnect(); process.exit(0); }).catch(() => { process.exit(1); });']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  admin:
    image: hiralal-admin:${HIRALAL_IMAGE_TAG:?HIRALAL_IMAGE_TAG is required}
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VCS_REF: ${HIRALAL_IMAGE_TAG:-unknown}
    container_name: hiralal_admin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
    expose:
      - '3000'
    networks:
      - hiralal_net
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  nginx:
    image: nginx:alpine
    container_name: hiralal_nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1/health']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hiralal_net
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

networks:
  hiralal_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  uploads:
    driver: local
