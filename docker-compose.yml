version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hiralal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-hiralal_rewards}
    expose:
      - '5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - hiralal_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hiralal_rewards}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hiralal_redis
    restart: unless-stopped
    expose:
      - '6379'
    volumes:
      - redisdata:/data
    networks:
      - hiralal_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiralal_backend
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-hiralal_rewards}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      SIGNCARE_API_KEY: ${SIGNCARE_API_KEY}
      SIGNCARE_APP_ID: ${SIGNCARE_APP_ID}
      RAZORPAYX_KEY_ID: ${RAZORPAYX_KEY_ID}
      RAZORPAYX_KEY_SECRET: ${RAZORPAYX_KEY_SECRET}
      RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER}
      RAZORPAYX_WEBHOOK_SECRET: ${RAZORPAYX_WEBHOOK_SECRET}
      SMS_API_KEY: ${SMS_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
    expose:
      - '5000'
    volumes:
      - uploads:/app/uploads
    networks:
      - hiralal_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiralal_worker
    restart: unless-stopped
    command: node dist/worker/index.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-hiralal_rewards}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RAZORPAYX_KEY_ID: ${RAZORPAYX_KEY_ID}
      RAZORPAYX_KEY_SECRET: ${RAZORPAYX_KEY_SECRET}
      RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER}
    networks:
      - hiralal_net

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: hiralal_admin
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
    expose:
      - '3000'
    networks:
      - hiralal_net

  nginx:
    image: nginx:alpine
    container_name: hiralal_nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - admin
    networks:
      - hiralal_net

networks:
  hiralal_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  uploads:
    driver: local
