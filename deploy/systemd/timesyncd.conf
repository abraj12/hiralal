# CERT-In Compliance: Mandatory Time Synchronization
# Reference: CERT-In Cyber Security Directions (Direction No. 20(3)/2022-CERT-In) Section 4(i)
# Deploy to /etc/systemd/timesyncd.conf or /etc/systemd/timesyncd.conf.d/cert-in.conf
#
# All ICT systems must synchronize their clocks with the NTP servers of National Informatics
# Centre (NIC) or National Physical Laboratory (NPL), or NTP servers traceable to these.

[Time]
NTP=time.nic.in time.nplindia.org
FallbackNTP=0.in.pool.ntp.org 1.in.pool.ntp.org time.cloudflare.com
RootDistanceMaxSec=5
PollIntervalMinSec=32
PollIntervalMaxSec=2048
