# CERT-In Compliance: 180-Day System and Application Log Retention
# Reference: CERT-In Cyber Security Directions (Direction No. 20(3)/2022-CERT-In) Section 4(ii)
# Deploy to /etc/logrotate.d/hiralal
#
# Direction mandate: Enable and maintain all system and application logs of all ICT systems
# securely for a rolling period of 180 consecutive days within Indian jurisdiction.

/var/log/nginx/*.log /var/log/hiralal/*.log /var/lib/docker/containers/*/*.log {
    daily
    missingok
    rotate 180
    compress
    delaycompress
    notifempty
    create 0640 root adm
    sharedscripts
    dateext
    dateformat -%Y%m%d
    postrotate
        # Signal nginx to reopen log files if running on host or inside container
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid) 2>/dev/null || true
        docker kill --signal="USR1" hiralal_nginx 2>/dev/null || true
    endscript
}
