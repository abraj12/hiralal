# docker-compose.ci.yml — CI-only Compose override for isolated integration testing.
# DO NOT use in production. Sets NODE_ENV=development so the HTTP server listens,
# while production config validator does not run. Exposes postgres port for migration runner.
# Apply with: docker compose -f docker-compose.yml -f docker-compose.ci.yml up
version: '3.8'

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    environment:
      NODE_ENV: development
      CI_INTEGRATION_MODE: "true"
      PLAY_INTEGRITY_ALLOW_MOCK: "true"
      PLAY_INTEGRITY_REQUIRE_LICENSING: "true"
      PLAY_INTEGRITY_ENFORCE_ACTIONS: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8081,http://localhost,https://localhost"

  worker:
    environment:
      NODE_ENV: development
      CI_INTEGRATION_MODE: "true"
