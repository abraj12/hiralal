name: Android Release Candidate Build

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact 40-character Git commit SHA on main to build release candidate from'
        required: true
        type: string
      confirm_release:
        description: 'Type "RELEASE" to confirm signed release candidate generation'
        required: true
        type: string
      build_target:
        description: 'Target artifact to build (apk, aab, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - aab
          - apk

permissions:
  contents: read
  actions: read

jobs:
  validate-and-build-signed-release:
    name: Build Signed Android Release Candidate
    runs-on: ubuntu-latest
    environment: android-release-signing
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref_name == 'main')

    steps:
      - name: Validate Release Inputs and Authorization
        env:
          CONFIRM_RELEASE: ${{ github.event.inputs.confirm_release }}
          RELEASE_SHA: ${{ github.event.inputs.release_sha }}
          BUILD_TARGET: ${{ github.event.inputs.build_target }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRM_RELEASE" != "RELEASE" ]]; then
            echo "::error::Release execution canceled. confirm_release must be exactly 'RELEASE'."
            exit 1
          fi

          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid release_sha format: '$RELEASE_SHA'. Must be a 40-character hexadecimal SHA."
            exit 1
          fi

          if [[ "$BUILD_TARGET" != "both" && "$BUILD_TARGET" != "aab" && "$BUILD_TARGET" != "apk" ]]; then
            echo "::error::Invalid build_target: '$BUILD_TARGET'. Must be one of 'both', 'aab', or 'apk'."
            exit 1
          fi

          if [[ "${GITHUB_REF:-}" != "refs/heads/main" && "${GITHUB_REF_NAME:-}" != "main" ]]; then
            echo "::error::Workflow execution refused: release candidate builds are restricted to refs/heads/main."
            exit 1
          fi

          RELEASE_SHA_LOWER="$(echo "$RELEASE_SHA" | tr '[:upper:]' '[:lower:]')"
          echo "VALIDATED_RELEASE_SHA=$RELEASE_SHA_LOWER" >> "$GITHUB_ENV"
          echo "VALIDATED_BUILD_TARGET=$BUILD_TARGET" >> "$GITHUB_ENV"

      - name: Validate Required Android Release Signing Secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING_SECRETS=()
          [ -z "$KEYSTORE_B64" ] && MISSING_SECRETS+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASS" ] && MISSING_SECRETS+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && MISSING_SECRETS+=("ANDROID_KEY_ALIAS")
          [ -z "$KEY_PASS" ] && MISSING_SECRETS+=("ANDROID_KEY_PASSWORD")

          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "::error::Missing required Android signing secrets: ${MISSING_SECRETS[*]}"
            echo "::error::Cannot create production release candidate without owner-provisioned release keystore."
            exit 1
          fi
          echo "All required Android release signing secrets are present."

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_sha }}
          fetch-depth: 0

      - name: Verify Exact Release Commit on Main and Successful CI Status
        env:
          RELEASE_SHA: ${{ env.VALIDATED_RELEASE_SHA }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main

          MAIN_HEAD="$(git rev-parse origin/main)"
          echo "Target Release SHA: ${RELEASE_SHA}"
          echo "origin/main Head:   ${MAIN_HEAD}"

          if [[ "${RELEASE_SHA}" != "${MAIN_HEAD}" ]]; then
            echo "::error::Release SHA ${RELEASE_SHA} does not match current origin/main head (${MAIN_HEAD}). Drift detected!"
            exit 1
          fi

          # Query structured CI workflow run fields
          echo "Verifying successful completed CI run for commit ${RELEASE_SHA}..."
          SUCCESSFUL_RUN="$(gh run list \
            --workflow="ci.yml" \
            --commit="${RELEASE_SHA}" \
            --json headSha,status,conclusion,databaseId \
            --jq '[.[] | select(.headSha == "'"${RELEASE_SHA}"'" and .status == "completed" and .conclusion == "success")] | first // empty' 2>/dev/null || echo "")"

          if [ -z "${SUCCESSFUL_RUN}" ]; then
            echo "::error::No successful completed CI run found for commit ${RELEASE_SHA}. Release build blocked."
            exit 1
          fi
          echo "Verified: Passing CI workflow exists for release commit ${RELEASE_SHA}."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          elif [ -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Materialize Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/hiralal_release.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Expo Android Clean Prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Verify Reproducible Signing and Play Integrity Config Plugins
        run: |
          BUILD_GRADLE="mobile/android/app/build.gradle"
          if ! grep -q "ANDROID_KEYSTORE_PATH" "$BUILD_GRADLE"; then
            echo "::error::withReleaseSigning plugin was not applied to $BUILD_GRADLE!"
            exit 1
          fi
          if ! grep -q "play-integrity" "$BUILD_GRADLE" && ! grep -q "playintegrity" "$BUILD_GRADLE"; then
            echo "::warning::Play Integrity references not found in build.gradle, checking native modules..."
          fi
          echo "Expo native configuration verified successfully."

      - name: Build Signed Android Release Artifacts
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TARGET: ${{ env.VALIDATED_BUILD_TARGET }}
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          chmod +x ./gradlew

          if [ "$TARGET" = "both" ] || [ "$TARGET" = "aab" ]; then
            echo "Building signed Android App Bundle (AAB)..."
            ./gradlew :app:bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"
          fi

          if [ "$TARGET" = "both" ] || [ "$TARGET" = "apk" ]; then
            echo "Building signed Release APK..."
            ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"
          fi

      - name: Verify Artifact Signature and Extract Fingerprints
        env:
          RELEASE_SHA: ${{ env.VALIDATED_RELEASE_SHA }}
          BUILD_TARGET: ${{ env.VALIDATED_BUILD_TARGET }}
          EXPECTED_RELEASE_CERT_SHA256: ${{ secrets.EXPECTED_RELEASE_CERT_SHA256 || vars.EXPECTED_RELEASE_CERT_SHA256 || '' }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          echo "### Android Release Candidate Verification Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit SHA:** \`${RELEASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target:** \`${BUILD_TARGET}\`" >> "$GITHUB_STEP_SUMMARY"

          # 0. Require valid EXPECTED_RELEASE_CERT_SHA256 (Fail-closed)
          RAW_EXPECTED="${EXPECTED_RELEASE_CERT_SHA256:-}"
          NORMALIZED_EXPECTED="$(echo "$RAW_EXPECTED" | tr '[:upper:]' '[:lower:]' | tr -d ' :' || true)"
          if [ -z "$NORMALIZED_EXPECTED" ] || ! echo "$NORMALIZED_EXPECTED" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::EXPECTED_RELEASE_CERT_SHA256 is missing, invalid, or malformed! Got '${RAW_EXPECTED}'. A valid 64-character hex SHA-256 fingerprint is required to verify release integrity."
            exit 1
          fi

          # Copy APK if exists
          APK_SRC="mobile/android/app/build/outputs/apk/release"
          if [ -d "$APK_SRC" ]; then
            find "$APK_SRC" -name "*.apk" -exec cp {} release-artifacts/ \;
          fi

          # Copy AAB if exists
          AAB_SRC="mobile/android/app/build/outputs/bundle/release"
          if [ -d "$AAB_SRC" ]; then
            find "$AAB_SRC" -name "*.aab" -exec cp {} release-artifacts/ \;
          fi

          # 1. Enforce existence of requested artifact set
          APK_COUNT=0
          AAB_COUNT=0
          APKS="$(find release-artifacts -maxdepth 1 -name "*.apk" 2>/dev/null || true)"
          AABS="$(find release-artifacts -maxdepth 1 -name "*.aab" 2>/dev/null || true)"

          [ -n "$APKS" ] && APK_COUNT=$(echo "$APKS" | wc -w)
          [ -n "$AABS" ] && AAB_COUNT=$(echo "$AABS" | wc -w)

          if [ "$BUILD_TARGET" = "both" ]; then
            if [ "$APK_COUNT" -eq 0 ] || [ "$AAB_COUNT" -eq 0 ]; then
              echo "::error::Target 'both' selected, but expected artifacts missing! (APKs: $APK_COUNT, AABs: $AAB_COUNT)"
              exit 1
            fi
          elif [ "$BUILD_TARGET" = "apk" ]; then
            if [ "$APK_COUNT" -eq 0 ]; then
              echo "::error::Target 'apk' selected, but no APK artifact found!"
              exit 1
            fi
          elif [ "$BUILD_TARGET" = "aab" ]; then
            if [ "$AAB_COUNT" -eq 0 ]; then
              echo "::error::Target 'aab' selected, but no AAB artifact found!"
              exit 1
            fi
          fi

          # 2. Signature verification for APKs using apksigner
          if [ -n "$APKS" ]; then
            echo "#### APK Signature Verification" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            for apk in $APKS; do
              echo "Verifying $apk with apksigner:" >> "$GITHUB_STEP_SUMMARY"
              APK_VERIFY_OUTPUT="$(apksigner verify --verbose --print-certs "$apk")"
              echo "$APK_VERIFY_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

              CERT_DIGEST="$(echo "$APK_VERIFY_OUTPUT" | grep -i "Signer #1 certificate SHA-256 digest:" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ' :' || echo "")"
              if [ -z "$CERT_DIGEST" ] || [ "$CERT_DIGEST" != "$NORMALIZED_EXPECTED" ]; then
                echo "::error::APK ($apk) certificate digest mismatch! Got '$CERT_DIGEST', expected '$NORMALIZED_EXPECTED'"
                exit 1
              fi
              echo "APK ($apk) certificate digest matches EXPECTED_RELEASE_CERT_SHA256."

              # Verify package name from actual built APK (fail closed)
              AAPT_CMD="aapt"
              if ! command -v aapt &>/dev/null; then
                AAPT_CMD="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt -type f 2>/dev/null | sort -V | tail -n 1 || echo "aapt")"
              fi
              ACTUAL_APK_PKG="$("$AAPT_CMD" dump badging "$apk" 2>/dev/null | grep -oP "package: name='\K[^']+" || aapt dump badging "$apk" 2>/dev/null | grep -oP "package: name='\K[^']+" || aapt2 dump badging "$apk" 2>/dev/null | grep -oP "package: name='\K[^']+" || true)"
              if [ -z "$ACTUAL_APK_PKG" ]; then
                echo "::error::Failed to extract package name from APK ($apk). Failing closed."
                exit 1
              fi
              if [ "$ACTUAL_APK_PKG" != "com.hiralal.rewards" ]; then
                echo "::error::APK package name is '$ACTUAL_APK_PKG', expected 'com.hiralal.rewards'!"
                exit 1
              fi
              echo "Verified APK package name from binary: $ACTUAL_APK_PKG"
            done
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          # 3. Signature and manifest verification for AABs using jarsigner, keytool, and bundletool
          if [ -n "$AABS" ]; then
            echo "#### AAB Signature Verification" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            for aab in $AABS; do
              echo "Verifying $aab with jarsigner:" >> "$GITHUB_STEP_SUMMARY"
              jarsigner -verify -verbose -certs "$aab" >> "$GITHUB_STEP_SUMMARY"

              echo "Verifying $aab certificate fingerprint with keytool:" >> "$GITHUB_STEP_SUMMARY"
              AAB_CERT_OUTPUT="$(keytool -printcert -jarfile "$aab")"
              echo "$AAB_CERT_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

              AAB_CERT_DIGEST="$(echo "$AAB_CERT_OUTPUT" | grep -i "SHA256:" | awk '{print $2}' | tr '[:upper:]' '[:lower:]' | tr -d ' :' || echo "")"
              if [ -z "$AAB_CERT_DIGEST" ] || [ "$AAB_CERT_DIGEST" != "$NORMALIZED_EXPECTED" ]; then
                echo "::error::AAB ($aab) certificate digest mismatch! Got '$AAB_CERT_DIGEST', expected '$NORMALIZED_EXPECTED'"
                exit 1
              fi
              echo "AAB ($aab) certificate digest matches EXPECTED_RELEASE_CERT_SHA256."

              # Verify package name from actual built AAB via bundletool
              if ! command -v bundletool &>/dev/null && [ ! -f /tmp/bundletool.jar ]; then
                curl -sSL "https://github.com/google/bundletool/releases/download/1.17.1/bundletool-all-1.17.1.jar" -o /tmp/bundletool.jar 2>/dev/null || true
              fi
              if command -v bundletool &>/dev/null; then
                AAB_MANIFEST="$(bundletool dump manifest --bundle="$aab" 2>/dev/null || true)"
              elif [ -f /tmp/bundletool.jar ]; then
                AAB_MANIFEST="$(java -jar /tmp/bundletool.jar dump manifest --bundle="$aab" 2>/dev/null || true)"
              else
                AAB_MANIFEST=""
              fi
              ACTUAL_AAB_PKG="$(echo "$AAB_MANIFEST" | grep -oP 'package="\K[^"]+' || echo "$AAB_MANIFEST" | grep -oP "package: name='\K[^']+" || true)"
              if [ -z "$ACTUAL_AAB_PKG" ]; then
                echo "::error::Failed to extract package name from AAB ($aab). Failing closed."
                exit 1
              fi
              if [ "$ACTUAL_AAB_PKG" != "com.hiralal.rewards" ]; then
                echo "::error::AAB package name is '$ACTUAL_AAB_PKG', expected 'com.hiralal.rewards'!"
                exit 1
              fi
              echo "Verified AAB package name from binary: $ACTUAL_AAB_PKG"
            done
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          # 4. Verify package name in mobile/app.json
          if [ -f "mobile/app.json" ]; then
            APP_PKG="$(node -e 'const c = require("./mobile/app.json"); console.log(c.expo?.android?.package || "");')"
            if [ "$APP_PKG" != "com.hiralal.rewards" ]; then
              echo "::error::Package name in app.json is '$APP_PKG', expected 'com.hiralal.rewards'!"
              exit 1
            fi
            echo "Verified package name in mobile/app.json: com.hiralal.rewards"
          fi

          # 5. Generate and verify deterministic SHA-256 Checksums
          cd release-artifacts
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + | sort -k2 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          echo "#### Artifact SHA-256 Checksums" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Signed Release Candidate Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ env.VALIDATED_RELEASE_SHA }}
          path: release-artifacts/*
          retention-days: 30

      - name: Shred and Clean Keystore Material
        if: always()
        run: |
          KEYSTORE="${ANDROID_KEYSTORE_PATH:-}"
          if [ -n "$KEYSTORE" ] && [ -f "$KEYSTORE" ]; then
            shred -u -z -n 3 "$KEYSTORE" 2>/dev/null || rm -f "$KEYSTORE"
            echo "Release keystore securely erased from ephemeral runner filesystem."
          fi
