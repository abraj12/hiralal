name: Production CI Pipeline - Hiralal & Sons Rewards Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, Typecheck, Migrations & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: hiralal_rewards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma Schema Validation
        working-directory: backend
        run: npx prisma validate

      - name: Prisma Client Generation
        working-directory: backend
        run: npx prisma generate

      - name: TypeScript Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Apply Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hiralal_rewards_test?schema=public
        run: npx prisma migrate deploy

      - name: Run Production Test Suite with Coverage
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hiralal_rewards_test?schema=public
          JWT_ACCESS_SECRET: test_jwt_access_secret_for_ci_pipeline_2026
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_for_ci_pipeline_2026
          ENCRYPTION_KEY: test_encryption_key_32bytes_sample_pipeline_ci_key
          FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          STORAGE_HMAC_SECRET: test_hmac_secret_for_ci_pipeline_2026
          MSG91_AUTH_KEY: test_msg91_auth_key_ci
          MSG91_TEMPLATE_ID: test_msg91_template_ci
          SIGNCARE_API_KEY: test_signcare_api_key_ci
          SIGNCARE_APP_ID: test_signcare_app_id_ci
          ADMIN_INITIAL_PASSWORD: AdminCiTest2026!
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: npm test -- --coverage

  docker-arm64-check:
    name: Docker ARM64 Build Verification (AWS Graviton2)
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image for linux/arm64
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: false
          tags: hiralal-backend:ci-arm64-test
