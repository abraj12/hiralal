name: Production CI Pipeline - Hiralal & Sons Rewards Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  backend-test:
    name: Backend Lint, Typecheck, Migrations & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: hiralal_rewards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hiralal_rewards_test?schema=public

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma Schema Validation
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hiralal_rewards_test?schema=public
        run: npx prisma validate

      - name: Prisma Client Generation
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hiralal_rewards_test?schema=public
        run: npx prisma generate

      - name: TypeScript Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Apply Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hiralal_rewards_test?schema=public
        run: npx prisma migrate deploy

      - name: Seed Initial Test Data
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hiralal_rewards_test?schema=public
          ADMIN_INITIAL_PASSWORD: Admin@123
          ENABLE_DEMO_SEED: true
        run: npm run seed

      - name: Run Production Test Suite with Coverage
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hiralal_rewards_test?schema=public
          JWT_ACCESS_SECRET: test_jwt_access_secret_for_ci_pipeline_2026
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_for_ci_pipeline_2026
          ENCRYPTION_KEY: test_encryption_key_32bytes_sample_pipeline_ci_key
          FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          STORAGE_HMAC_SECRET: test_hmac_secret_for_ci_pipeline_2026
          MSG91_AUTH_KEY: test_msg91_auth_key_ci
          MSG91_TEMPLATE_ID: test_msg91_template_ci
          SIGNCARE_API_KEY: test_signcare_api_key_ci
          SIGNCARE_APP_ID: test_signcare_app_id_ci
          ADMIN_INITIAL_PASSWORD: Admin@123
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        shell: bash
        run: |
          set -o pipefail
          npm test -- --coverage --forceExit 2>&1 | tee test_output.log

      - name: Publish Test Output to Summary
        if: always()
        working-directory: backend
        run: |
          if [ -f test_output.log ]; then
            echo "### Jest Test Execution Failures & Diagnostics" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(FAIL |● |Error: )" -A 10 test_output.log | head -n 80 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Jest Execution Output Tail" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Output Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-test-log
          path: backend/test_output.log
          retention-days: 7

  docker-arm64-check:
    name: Docker ARM64 Build Verification (AWS Graviton2)
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image for linux/arm64
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: false
          tags: hiralal-backend:ci-arm64-test

      - name: Build Admin Panel Docker Image for linux/arm64
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          platforms: linux/arm64
          push: false
          tags: hiralal-admin:ci-arm64-test

  full-stack-compose-smoke-test:
    name: Full 6-Container Docker Compose Stack Smoke Test
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Fallback SSL Certificates for Nginx
        run: |
          chmod +x scripts/*.sh
          ./scripts/generate-origin-certs.sh

      - name: Run Cloudflare Origin SSL Precheck
        run: |
          ./scripts/verify-nginx-ssl.sh ./nginx/ssl

      - name: Prepare Docker Environment Configuration
        run: |
          cp .env.example .env

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build and Start Full Multi-Container Production Stack
        run: |
          docker compose up -d --build 2>&1 | tee compose_up.log || {
            echo "### Docker Compose Up Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat compose_up.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Container Status" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            docker compose ps >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Container Logs" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            docker compose logs --tail=100 >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Wait for Stack Health and Readiness (Postgres, Redis, API, Worker, Admin, Nginx)
        timeout-minutes: 5
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            UNHEALTHY=$(docker ps --filter "health=unhealthy" -q)
            STARTING=$(docker ps --filter "health=starting" -q)
            if [ -n "$UNHEALTHY" ]; then
              echo "Error: Containers reported unhealthy status!"
              docker compose ps
              docker compose logs
              exit 1
            fi
            if [ -z "$STARTING" ]; then
              echo "All containers with health checks have reached healthy status."
              break
            fi
            echo "Waiting for containers to initialize ($i/30)..."
            sleep 5
          done

      - name: Verify All 6 Stack Containers Running
        run: |
          docker compose ps
          RUNNING_COUNT=$(docker compose ps --services --filter "status=running" | wc -l)
          echo "Running services count: $RUNNING_COUNT / 6"
          if [ "$RUNNING_COUNT" -lt 6 ]; then
            echo "Error: Not all 6 services are running!"
            docker compose logs
            exit 1
          fi

      - name: Smoke Test - HTTP Health Probe through Nginx
        run: |
          echo "Testing HTTP /health through Nginx..."
          curl -f -s http://localhost/health | grep -i "ok"

      - name: Smoke Test - HTTPS Health Probe through Nginx (TLS Termination)
        run: |
          echo "Testing HTTPS /health through Nginx..."
          curl -k -f -s https://localhost/health | grep -i "ok"

      - name: Smoke Test - API Reverse Proxy Routing (/api)
        run: |
          echo "Testing HTTPS /api/auth routing to backend through Nginx..."
          HTTP_RESPONSE=$(curl -k -s -w "\nHTTP_STATUS:%{http_code}" https://localhost/api/auth/login -X POST -H "Content-Type: application/json" -d '{}')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          echo "HTTP Response Status from API via Nginx: $HTTP_STATUS"
          echo "HTTP Response Payload: $HTTP_RESPONSE"
          if [ "$HTTP_STATUS" -ne 400 ] && [ "$HTTP_STATUS" -ne 401 ]; then
            echo "Unexpected HTTP status: $HTTP_STATUS"
            docker compose logs backend
            exit 1
          fi

      - name: Smoke Test - Admin Panel Reverse Proxy Routing (/)
        run: |
          echo "Testing HTTPS / routing to Next.js admin frontend through Nginx..."
          curl -k -f -s https://localhost/ | grep -i "<html" || curl -k -f -s https://localhost/ | grep -i "login"

      - name: Compose Stack Teardown
        if: always()
        run: |
          docker compose down -v || true

  mobile-check:
    name: Mobile App Typecheck Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: TypeScript Typecheck
        working-directory: mobile
        run: npx tsc --noEmit
