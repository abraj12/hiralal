name: Production CI Pipeline - Hiralal & Sons Rewards Platform

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'audit/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash

      - name: Run actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color -ignore 'SC2086' -ignore 'SC2129'
        shell: bash

      - name: Test Deployment Health Validation Script
        run: python3 scripts/test_verify_deployment_health.py

  backend-test:
    name: Backend Lint, Typecheck, Migrations & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: hiralal_rewards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hiralal_rewards_test?schema=public

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma Schema Validation
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hiralal_rewards_test?schema=public
        run: npx prisma validate

      - name: Prisma Client Generation
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hiralal_rewards_test?schema=public
        run: npx prisma generate

      - name: TypeScript Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Apply Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hiralal_rewards_test?schema=public
        run: npx prisma migrate deploy

      - name: Seed Initial Test Data
        working-directory: backend
        env:
          BILL_ADMIN_INITIAL_PASSWORD: BillAdminSecure#2026
          OPERATIONS_ADMIN_INITIAL_PASSWORD: OpsAdminSecure#2026
          ENABLE_DEMO_SEED: true
        run: npm run seed

      - name: Run Production Test Suite with Coverage
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hiralal_rewards_test?schema=public
          JWT_ACCESS_SECRET: test_jwt_access_secret_for_ci_pipeline_2026
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_for_ci_pipeline_2026
          ENCRYPTION_KEY: test_encryption_key_32bytes_sample_pipeline_ci_key
          FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          STORAGE_HMAC_SECRET: test_hmac_secret_for_ci_pipeline_2026
          MSG91_AUTH_KEY: test_msg91_auth_key_ci
          MSG91_TEMPLATE_ID: test_msg91_template_ci
          SIGNCARE_API_KEY: test_signcare_api_key_ci
          BILL_ADMIN_INITIAL_PASSWORD: BillAdminSecure#2026
          OPERATIONS_ADMIN_INITIAL_PASSWORD: OpsAdminSecure#2026
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          RAZORPAYX_KEY_ID: rzp_test_hiralal2026
          RAZORPAYX_KEY_SECRET: rzp_secret_hiralal2026
          RAZORPAYX_ACCOUNT_NUMBER: 2323230041123456
          RAZORPAYX_WEBHOOK_SECRET: webhook_secret_hiralal_rzpx_2026
          PLAY_INTEGRITY_PACKAGE_NAME: com.hiralal.rewards
          PLAY_INTEGRITY_ALLOW_MOCK: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- --coverage --forceExit 2>&1 | tee test_output.log

      - name: Publish Test Output to Summary
        if: always()
        working-directory: backend
        run: |
          if [ -f test_output.log ]; then
            echo "### Jest Test Execution Failures & Diagnostics" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(FAIL |● |Error: )" -A 10 test_output.log | head -n 80 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Jest Execution Output Tail" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Output Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-test-log
          path: backend/test_output.log
          retention-days: 7

      - name: Upload Part 2A.5 Audit Remediation Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-2a5-audit-remediation-report
          path: docs/audits/part_2a5_audit_remediation_report.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload Part 2 Master Remediation Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-2-master-remediation-report
          path: docs/audits/part_2_master_remediation_report.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload Part 2 Play Integrity Hardening Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-2-play-integrity-hardening-report
          path: docs/audits/part_2_play_integrity_hardening_report.md
          if-no-files-found: error
          retention-days: 30


  admin-date-tests:
    name: Admin Date Helper Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Admin Dependencies
        working-directory: admin
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: admin
        run: npx tsc --noEmit

      - name: Run Admin Date Helper Tests
        working-directory: admin
        run: |
          npm test 2>&1 | tee admin_test_output.log

      - name: Publish Admin Test Summary
        if: always()
        working-directory: admin
        run: |
          if [ -f admin_test_output.log ]; then
            echo "### Admin Date Helper Test Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat admin_test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  docker-arm64-check:
    name: Docker ARM64 Build Verification (AWS Graviton2)
    runs-on: ubuntu-latest
    needs: [backend-test, admin-date-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image for linux/arm64
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: false
          tags: hiralal-backend:ci-arm64-test

      - name: Build Admin Panel Docker Image for linux/arm64
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          platforms: linux/arm64
          push: false
          tags: hiralal-admin:ci-arm64-test

  full-stack-compose-smoke-test:
    name: Full 6-Container Docker Compose Stack Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, admin-date-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Fallback SSL Certificates for Nginx
        run: |
          chmod +x scripts/*.sh
          ./scripts/generate-origin-certs.sh

      - name: Run Cloudflare Origin SSL Precheck
        run: |
          ./scripts/verify-nginx-ssl.sh ./nginx/ssl

      - name: Prepare Docker Environment Configuration
        run: |
          cp .env.example .env
          sed -i 's/REPLACE_WITH_SECURE_POSTGRES_PASSWORD/HiralalTestPostgresPass2026!/g' .env
          sed -i 's/REPLACE_WITH_SECURE_REDIS_PASSWORD/HiralalTestRedisPass2026!/g' .env
          sed -i 's/REPLACE_WITH_64_CHAR_HEX_JWT_ACCESS_SECRET/a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90/g' .env
          sed -i 's/REPLACE_WITH_64_CHAR_HEX_JWT_REFRESH_SECRET/b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1/g' .env
          sed -i 's/REPLACE_WITH_64_CHAR_HEX_JWT_ADMIN_ACCESS_SECRET/c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5/g' .env
          sed -i 's/REPLACE_WITH_64_CHAR_HEX_ENCRYPTION_KEY/c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2/g' .env
          sed -i 's/REPLACE_WITH_64_CHAR_HEX_FIELD_ENCRYPTION_KEY/d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3/g' .env
          sed -i 's/REPLACE_WITH_SECURE_STORAGE_HMAC_SECRET/e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4/g' .env
          sed -i 's/REPLACE_WITH_CF_R2_ACCESS_KEY_ID/ci_test_r2_access_key_valid/g' .env
          sed -i 's/REPLACE_WITH_CF_R2_SECRET_ACCESS_KEY/ci_test_r2_secret_key_valid_secret/g' .env
          sed -i 's/REPLACE_WITH_ACCOUNT_ID/ci-test-account-id-2026/g' .env
          sed -i 's/REPLACE_WITH_SIGNCARE_API_KEY/ci_test_signcare_api_key_valid/g' .env
          sed -i 's/REPLACE_WITH_SIGNCARE_APP_ID/ci_test_signcare_app_id_valid/g' .env
          sed -i 's/REPLACE_WITH_RAZORPAYX_KEY_ID/rzp_test_hiralal2026/g' .env
          sed -i 's/REPLACE_WITH_RAZORPAYX_KEY_SECRET/rzp_secret_hiralal2026/g' .env
          sed -i 's/REPLACE_WITH_RAZORPAYX_ACCOUNT_NUMBER/2323230041123456/g' .env
          sed -i 's/REPLACE_WITH_RAZORPAYX_WEBHOOK_SECRET/ci_test_webhook_secret_rzpx_2026/g' .env
          sed -i 's/REPLACE_WITH_MSG91_AUTH_KEY/ci_test_msg91_auth_key_valid/g' .env
          sed -i 's/REPLACE_WITH_MSG91_TEMPLATE_ID/ci_test_msg91_template_valid/g' .env
          sed -i 's/REPLACE_WITH_PRODUCTION_BILL_ADMIN_10DIGIT_MOBILE/9876540001/g' .env
          sed -i 's/REPLACE_WITH_PRODUCTION_OPERATIONS_ADMIN_10DIGIT_MOBILE/9876540002/g' .env
          sed -i 's/REPLACE_WITH_INITIAL_BILL_ADMIN_PASSWORD/HiralalBillAdminPass2026!/g' .env
          sed -i 's/REPLACE_WITH_INITIAL_OPERATIONS_ADMIN_PASSWORD/HiralalOpsAdminPass2026!/g' .env
          sed -i 's/REPLACE_WITH_INITIAL_ADMIN_PASSWORD/HiralalInitialAdminPass2026!/g' .env
          # CI smoke-test overrides: disable real Play Integrity and Firebase to allow container startup without secrets
          sed -i 's/REPLACE_WITH_PLAY_INTEGRITY_CLIENT_EMAIL/ci_play_integrity_client_email@ci.iam.gserviceaccount.com/g' .env
          sed -i 's/REPLACE_WITH_PLAY_INTEGRITY_PRIVATE_KEY/CI_STUB_PRIVATE_KEY/g' .env
          sed -i 's/REPLACE_WITH_SHA256_CERT_DIGEST/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/g' .env
          sed -i 's/REPLACE_WITH_FIREBASE_PROJECT_ID/ci-hiralal-firebase-stub/g' .env
          sed -i 's/REPLACE_WITH_FIREBASE_CLIENT_EMAIL/ci-firebase@ci-hiralal-firebase-stub.iam.gserviceaccount.com/g' .env
          sed -i 's/REPLACE_WITH_FIREBASE_PRIVATE_KEY/CI_STUB_FIREBASE_KEY/g' .env
          # Override production-safety flags to allow CI stack to start without real credentials
          sed -i 's/PLAY_INTEGRITY_REQUIRE_LICENSING=true/PLAY_INTEGRITY_REQUIRE_LICENSING=false/g' .env
          sed -i 's/PLAY_INTEGRITY_ALLOW_MOCK=false/PLAY_INTEGRITY_ALLOW_MOCK=true/g' .env
          sed -i 's/PLAY_INTEGRITY_ENFORCE_ACTIONS=true/PLAY_INTEGRITY_ENFORCE_ACTIONS=false/g' .env

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build and Start Full Multi-Container Production Stack
        run: |
          docker compose up -d --build 2>&1 | tee compose_up.log || {
            echo "### Docker Compose Up Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat compose_up.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Container Status" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            docker compose ps >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Container Logs" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            docker compose logs --tail=100 >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Wait for Stack Health and Readiness (Postgres, Redis, API, Worker, Admin, Nginx)
        timeout-minutes: 5
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            UNHEALTHY=$(docker ps --filter "health=unhealthy" -q)
            STARTING=$(docker ps --filter "health=starting" -q)
            if [ -n "$UNHEALTHY" ]; then
              echo "Error: Containers reported unhealthy status!"
              docker compose ps
              docker compose logs
              exit 1
            fi
            if [ -z "$STARTING" ]; then
              echo "All containers with health checks have reached healthy status."
              break
            fi
            echo "Waiting for containers to initialize ($i/30)..."
            sleep 5
          done

      - name: Verify All 6 Stack Containers Running
        run: |
          docker compose ps
          RUNNING_COUNT=$(docker compose ps --services --filter "status=running" | wc -l)
          echo "Running services count: $RUNNING_COUNT / 6"
          if [ "$RUNNING_COUNT" -lt 6 ]; then
            echo "Error: Not all 6 services are running!"
            docker compose logs
            exit 1
          fi

      - name: Smoke Test - HTTP Health Probe through Nginx
        run: |
          echo "Testing HTTP /health through Nginx..."
          curl -f -s http://localhost/health | grep -i "ok"

      - name: Smoke Test - HTTPS Health Probe through Nginx (TLS Termination)
        run: |
          echo "Testing HTTPS /health through Nginx..."
          curl -k -f -s https://localhost/health | grep -i "ok"

      - name: Smoke Test - API Reverse Proxy Routing (/api)
        run: |
          echo "Testing HTTPS /api/auth routing to backend through Nginx..."
          HTTP_RESPONSE=$(curl -k -s -w "\nHTTP_STATUS:%{http_code}" https://localhost/api/auth/login -X POST -H "Content-Type: application/json" -d '{}')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          echo "HTTP Response Status from API via Nginx: $HTTP_STATUS"
          echo "HTTP Response Payload: $HTTP_RESPONSE"
          if [ "$HTTP_STATUS" -ne 400 ] && [ "$HTTP_STATUS" -ne 401 ]; then
            echo "Unexpected HTTP status: $HTTP_STATUS"
            docker compose logs backend
            exit 1
          fi

      - name: Smoke Test - Admin Panel Reverse Proxy Routing (/)
        run: |
          echo "Testing HTTPS / routing to Next.js admin frontend through Nginx..."
          curl -k -f -s https://localhost/ | grep -i "<html" || curl -k -f -s https://localhost/ | grep -i "login"

      - name: Compose Stack Teardown
        if: always()
        run: |
          docker compose down -v || true

  mobile-check:
    name: Mobile App Typecheck & Plugin Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: TypeScript Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Run Mobile Plugin Unit Tests
        working-directory: mobile
        run: npm test

  mobile-android-build:
    name: Mobile Native Android Build (Gradle Debug APK)
    runs-on: ubuntu-latest
    needs: [mobile-check]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          elif [ -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Expo Android Prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Android Debug APK
        working-directory: mobile/android
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

