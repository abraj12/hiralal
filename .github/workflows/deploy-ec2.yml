name: Deploy to Production AWS EC2 (Graviton2 ARM64)

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "DEPLOY" to confirm production release'
        required: true
        default: 'DEPLOY'
  workflow_run:
    workflows: ['Production CI Pipeline - Hiralal & Sons Rewards Platform']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-production:
    name: Production Deployment to AWS EC2
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_deploy == 'DEPLOY') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH Key and Verify Host Key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${EC2_HOST}" ] || [ -z "${EC2_SSH_KEY}" ]; then
            echo "[FATAL ERROR] Mandatory EC2 deployment secrets (EC2_HOST or EC2_SSH_KEY) are missing. Halting deployment." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${EC2_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${EC2_SSH_KNOWN_HOSTS}" ]; then
            echo "${EC2_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Execute Remote Deployment on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          echo "Target deployment commit: ${TARGET_SHA}"

          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "${EC2_USER}@${EC2_HOST}" TARGET_SHA="${TARGET_SHA}" 'bash -s' << 'EOF'
            set -euo pipefail
            echo "==> Deploying Hiralal & Sons Rewards Platform on AWS Graviton2..."
            
            APP_DIR="${APP_DIR:-/opt/hiralal}"
            if [ ! -d "${APP_DIR}" ]; then
              APP_DIR="${HOME}/hiralal"
            fi
            
            cd "${APP_DIR}"
            echo "Working directory: $(pwd)"
            
            # Fetch and fast-forward latest release on main
            git fetch origin main
            git reset --hard origin/main
            
            DEPLOYED_SHA=$(git rev-parse HEAD)
            echo "Successfully checked out release commit: ${DEPLOYED_SHA}"
            
            # Verify origin SSL certificates
            if [ -f scripts/verify-nginx-ssl.sh ]; then
              chmod +x scripts/*.sh
              ./scripts/verify-nginx-ssl.sh ./nginx/ssl || true
            fi
            
            # Build and deploy multi-container stack
            docker compose up -d --build
            
            # Run database migrations
            echo "Applying Prisma database migrations..."
            docker compose exec -T backend npx prisma migrate deploy
            
            # Wait for container health checks
            echo "Verifying service readiness..."
            sleep 10
            docker compose ps
            
            # Smoke test health probe
            HEALTH_URL="http://localhost/health"
            if curl -f -s "${HEALTH_URL}" | grep -qi "ok"; then
              echo "==> Deployment SUCCESS: Release ${DEPLOYED_SHA} healthy and verified!"
            else
              echo "==> Health probe failed. Inspecting logs:"
              docker compose logs --tail=50
              exit 1
            fi
          EOF
