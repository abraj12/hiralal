name: Deploy to Production AWS EC2 (Graviton2 ARM64)

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type DEPLOY to authorize a production release'
        required: true
        type: string
      release_sha:
        description: 'Exact full commit SHA approved for production'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-production:
    name: Production Deployment to AWS EC2
    runs-on: ubuntu-latest
    environment: production-ec2
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref_name == 'main') &&
      github.event.inputs.confirm_deploy == 'DEPLOY'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Release Authorization, Target SHA & CI Status
        env:
          CONFIRM_DEPLOY: ${{ github.event.inputs.confirm_deploy }}
          RELEASE_SHA: ${{ github.event.inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Validating production deployment authorization and parameters..."

          # 1. Validate confirmation string
          if [ "${CONFIRM_DEPLOY}" != "DEPLOY" ]; then
            echo "[FATAL ERROR] Production release not authorized: confirm_deploy must be exactly 'DEPLOY'." >&2
            exit 1
          fi

          # 2. Validate release_sha format (strict 40-character hex string)
          if ! [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "[FATAL ERROR] Invalid release_sha format: must be a 40-character hexadecimal commit SHA." >&2
            exit 1
          fi

          # 3. Verify SHA exists on origin/main and matches origin/main without drift
          git fetch origin main
          if ! git rev-parse --verify "${RELEASE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "[FATAL ERROR] Target release SHA ${RELEASE_SHA} does not exist in commit history." >&2
            exit 1
          fi

          MAIN_HEAD=$(git rev-parse origin/main)
          echo "Target Release SHA: ${RELEASE_SHA}"
          echo "origin/main Head:   ${MAIN_HEAD}"

          if [ "${RELEASE_SHA}" != "${MAIN_HEAD}" ]; then
            echo "[FATAL ERROR] Release drift detected: release_sha (${RELEASE_SHA}) does not match origin/main head (${MAIN_HEAD})." >&2
            exit 1
          fi

          # 4. Verify CI workflow completed successfully for this exact SHA
          echo "Verifying CI pipeline status for commit ${RELEASE_SHA}..."
          CI_CONCLUSION=$(gh run list --commit "${RELEASE_SHA}" --workflow "ci.yml" --json conclusion --jq '.[0].conclusion' 2>/dev/null || echo "")
          if [ "${CI_CONCLUSION}" != "success" ]; then
            echo "[FATAL ERROR] Production CI workflow did not succeed for commit ${RELEASE_SHA} (status: '${CI_CONCLUSION}'). Deployment blocked." >&2
            exit 1
          fi
          echo "Verified: CI pipeline passed with conclusion 'success' for commit ${RELEASE_SHA}."

      - name: Configure SSH Key and Verify Host Key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${EC2_HOST}" ] || [ -z "${EC2_SSH_KEY}" ] || [ -z "${EC2_SSH_KNOWN_HOSTS}" ]; then
            echo "[FATAL ERROR] Mandatory EC2 deployment secrets (EC2_HOST, EC2_SSH_KEY, or EC2_SSH_KNOWN_HOSTS) are missing. Halting deployment." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${EC2_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${EC2_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Execute Remote Deployment on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          TARGET_SHA: ${{ github.event.inputs.release_sha }}
        run: |
          echo "Target deployment commit: ${TARGET_SHA}"

          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "${EC2_USER}@${EC2_HOST}" TARGET_SHA="${TARGET_SHA}" 'bash -s' << 'EOF'
            set -euo pipefail
            echo "==> Deploying Hiralal & Sons Rewards Platform on AWS Graviton2..."
            
            APP_DIR="${APP_DIR:-/opt/hiralal}"
            if [ ! -d "${APP_DIR}" ]; then
              APP_DIR="${HOME}/hiralal"
            fi
            
            cd "${APP_DIR}"
            echo "Working directory: $(pwd)"
            
            STATE_DIR="${APP_DIR}/deployment-state"
            RELEASES_DIR="${APP_DIR}/releases"
            mkdir -p "${STATE_DIR}" "${RELEASES_DIR}/${TARGET_SHA}"

            # 1. Determine running release from persistent deployment-state record first (fail-closed)
            PREVIOUS_SHA="NONE"
            if [ -f "${STATE_DIR}/active-release.json" ]; then
              PREVIOUS_SHA=$(node -e '
                const fs = require("node:fs");
                try {
                  const state = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  const sha = (state.gitSha || state.releaseSha || state.releaseId || "").trim();
                  if (!/^[0-9a-f]{40}$/i.test(sha)) {
                    console.error("[FATAL ERROR] active-release.json contains invalid or corrupt git SHA:", sha);
                    process.exit(2);
                  }
                  console.log(sha);
                } catch (err) {
                  console.error("[FATAL ERROR] Failed to parse active-release.json:", err.message);
                  process.exit(2);
                }
              ' "${STATE_DIR}/active-release.json") || {
                echo "[FATAL ERROR] Corrupted active-release.json. Halting deployment (fail closed)." >&2
                exit 2
              }
            fi
            echo "Previously running release SHA: ${PREVIOUS_SHA}"

            # Capture actual running container image IDs before modifying working tree
            CURRENT_BACKEND_IMG=$(docker inspect --format='{{.Image}}' hiralal_backend 2>/dev/null || echo "")
            CURRENT_WORKER_IMG=$(docker inspect --format='{{.Image}}' hiralal_worker 2>/dev/null || echo "")
            CURRENT_ADMIN_IMG=$(docker inspect --format='{{.Image}}' hiralal_admin 2>/dev/null || echo "")

            # Tag existing application container images with PREVIOUS_SHA to ensure immutable retention
            if [ "${PREVIOUS_SHA}" != "NONE" ]; then
              if [ -n "${CURRENT_BACKEND_IMG}" ]; then
                docker tag "${CURRENT_BACKEND_IMG}" hiralal-backend:"${PREVIOUS_SHA}"
              fi
              if [ -n "${CURRENT_WORKER_IMG}" ]; then
                docker tag "${CURRENT_WORKER_IMG}" hiralal-worker:"${PREVIOUS_SHA}"
              fi
              if [ -n "${CURRENT_ADMIN_IMG}" ]; then
                docker tag "${CURRENT_ADMIN_IMG}" hiralal-admin:"${PREVIOUS_SHA}"
              fi
            fi

            # Record pre-deployment attempt state
            PRE_DEPLOY_TMP="$(mktemp "${STATE_DIR}/pre-deployment.json.XXXXXX")"
            printf '{\n  "attemptedAt": "%s",\n  "targetSha": "%s",\n  "previousSha": "%s",\n  "status": "IN_PROGRESS"\n}\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              "${TARGET_SHA}" \
              "${PREVIOUS_SHA}" > "${PRE_DEPLOY_TMP}"
            chmod 600 "${PRE_DEPLOY_TMP}"
            mv "${PRE_DEPLOY_TMP}" "${STATE_DIR}/pre-deployment.json"

            # Fetch origin and checkout the exact verified release commit
            git fetch origin
            git checkout "${TARGET_SHA}"
            
            DEPLOYED_SHA=$(git rev-parse HEAD)
            echo "Successfully checked out release commit: ${DEPLOYED_SHA}"
            if [ "${DEPLOYED_SHA}" != "${TARGET_SHA}" ]; then
              echo "[FATAL ERROR] Release drift detected: Deployed SHA ${DEPLOYED_SHA} != Target SHA ${TARGET_SHA}" >&2
              exit 1
            fi
            
            # Verify origin SSL certificates (strict TLS verification - fail closed)
            if [ -f scripts/verify-nginx-ssl.sh ]; then
              chmod +x scripts/*.sh
              ./scripts/verify-nginx-ssl.sh ./nginx/ssl
            fi
            
            # Build stack images with immutable release image tag
            export HIRALAL_IMAGE_TAG="${TARGET_SHA}"
            echo "Building application container images for release ${HIRALAL_IMAGE_TAG}..."
            docker compose build

            # Ensure data stores are online for backup and migration
            echo "Starting postgres and redis data tier..."
            docker compose up -d postgres redis

            # Wait up to 30 seconds for postgres healthy status (fail closed)
            echo "Waiting for postgres to become healthy..."
            POSTGRES_HEALTHY=false
            for i in $(seq 1 30); do
              if docker compose ps postgres | grep -qi "healthy"; then
                echo "Postgres is healthy."
                POSTGRES_HEALTHY=true
                break
              fi
              sleep 1
            done
            if [ "${POSTGRES_HEALTHY}" != "true" ]; then
              echo "[FATAL ERROR] Postgres failed to reach healthy state within 30 seconds. Halting deployment." >&2
              exit 1
            fi

            # Wait up to 30 seconds for redis healthy status (fail closed)
            echo "Waiting for redis to become healthy..."
            REDIS_HEALTHY=false
            for i in $(seq 1 30); do
              if docker compose ps redis | grep -qi "healthy"; then
                echo "Redis is healthy."
                REDIS_HEALTHY=true
                break
              fi
              sleep 1
            done
            if [ "${REDIS_HEALTHY}" != "true" ]; then
              echo "[FATAL ERROR] Redis failed to reach healthy state within 30 seconds. Halting deployment." >&2
              exit 1
            fi
            
            # Pre-deployment database backup gate before applying migrations (fail closed)
            echo "Executing pre-deployment database backup gate..."
            if [ ! -f scripts/backup-db.sh ]; then
              echo "[FATAL ERROR] Mandatory backup script scripts/backup-db.sh is missing. Halting deployment before migrations." >&2
              exit 1
            fi
            chmod +x scripts/*.sh
            ./scripts/backup-db.sh || {
              echo "[FATAL ERROR] Pre-deployment database backup gate failed. Halting deployment before migrations." >&2
              exit 1
            }

            # Run database migrations using dedicated migration runner
            echo "Building and applying Prisma database migrations..."
            docker compose --profile tools build migrate
            docker compose --profile tools run --rm migrate

            # Launch full application stack
            echo "Starting all application services..."
            docker compose up -d
            
            # Wait for container health checks
            echo "Verifying service readiness..."
            sleep 10
            docker compose ps
            
            # Smoke test health & readiness probes via authoritative JSON validation
            HEALTH_URL="http://localhost/health"
            READY_URL="http://localhost/health/ready"

            echo "Checking API liveness..."
            HEALTH_JSON="$(curl --fail --silent --show-error "${HEALTH_URL}" 2>/dev/null || echo '{"status":"down"}')"

            echo "Checking dependency readiness..."
            READY_JSON="$(curl --fail --silent --show-error "${READY_URL}" 2>/dev/null || echo '{"status":"unready","checks":{}}')"

            CANDIDATE_HEALTHY=false
            if python3 scripts/verify-deployment-health.py "${HEALTH_JSON}" "${READY_JSON}"; then
              CANDIDATE_HEALTHY=true
              echo "==> Deployment SUCCESS: Release ${DEPLOYED_SHA} healthy and verified!"

              # Record active release state metadata atomically using printf
              DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              STATE_TMP="$(mktemp "${STATE_DIR}/active-release.json.XXXXXX")"

              printf '{\n  "releaseId": "%s",\n  "gitSha": "%s",\n  "deployedAt": "%s",\n  "status": "HEALTHY",\n  "images": {\n    "backend": "hiralal-backend:%s",\n    "worker": "hiralal-worker:%s",\n    "admin": "hiralal-admin:%s"\n  }\n}\n' \
                "${DEPLOYED_SHA}" \
                "${DEPLOYED_SHA}" \
                "${DEPLOYED_AT}" \
                "${DEPLOYED_SHA}" \
                "${DEPLOYED_SHA}" \
                "${DEPLOYED_SHA}" > "${STATE_TMP}"

              node -e '
                const fs = require("fs");
                JSON.parse(fs.readFileSync(0, "utf8"));
              ' < "${STATE_TMP}"

              chmod 600 "${STATE_TMP}"
              mv "${STATE_TMP}" "${STATE_DIR}/active-release.json"
              cp "${STATE_DIR}/active-release.json" "${RELEASES_DIR}/${TARGET_SHA}/release.json"
            else
              echo "[FATAL ERROR] Candidate release ${TARGET_SHA} failed post-startup health verification."
            fi

            if [ "${CANDIDATE_HEALTHY}" != "true" ]; then
              echo "[ROLLBACK GATE] Candidate release failed health checks. Initiating safe application-image rollback..."
              echo "Preserving database schema forward-only; NO destructive database restore will be executed over live writes."
              chmod +x scripts/deploy/*.sh
              ./scripts/deploy/rollback-release.sh "${PREVIOUS_SHA}" "${TARGET_SHA}"
              exit 1
            fi
          EOF
